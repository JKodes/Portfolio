<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="app.css" />
    <style>
      .navbar-brand,
      .navbar-nav,
      .navbar-links {
        font-family: "Press Start 2P", cursive;
        font-size: 0.8rem;
      }
      .navbar-nav,
      .nav-item {
        margin: 0 10px;
      }

      .navbar {
        padding-top: 1rem;
        padding-bottom: 1rem;
      }

      body {
        font-family: "Roboto", sans-serif;
      }

      .hero-heading {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        line-height: 1.5;
      }

      .form-check-input:checked {
        background-color: #212529;
        border-color: #212529;
      }

      .form-switch .form-check-input {
        height: 1.5rem;
        width: 3rem;
        cursor: pointer;
      }

      .form-switch .form-check-input:focus {
        border-color: rgba(0, 0, 0.6, 0.25);
        box-shadow: none;
      }

      .theme-icon {
        cursor: pointer;
        font-size: 1.2rem;
        vertical-align: middle;
      }
      html[data-bs-theme="dark"] {
        --bs-body-bg: #212529;
        --bs-body-color: #f8f9fa;
      }

      /* Dark mode support for scroller */
      html[data-bs-theme="dark"] .scroller-container {
        background-color: #343a40;
      }

      html[data-bs-theme="dark"] .language-name {
        color: #f8f9fa;
      }

      html[data-bs-theme="dark"] .icon {
        filter: invert(0.8) !important;
      }
    </style>
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">JS</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/project.html">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contacts.html">Contact</a>
            </li>
          </ul>
        </div>
        <div class="form-check form-switch ms-auto d-none d-lg-block">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="darkModeToggle"
          />
          <label class="form-check-label" for="darkModeToggle">
            <i class="bi bi-brightness-high theme-icon" id="themeIcon"></i>
          </label>
        </div>
      </div>
    </nav>
    <!-- Contact Section -->
    <div class="container py-5 text-center" id="contact">
      <!-- Contact Heading -->
      <h1 style="font-family: 'Press 2P', sans-serif">Contact</h1>

      <!-- LinkedIn Row -->
      <div class="mt-4 d-flex justify-content-center align-items-center gap-2">
        <h5 class="mb-0">LinkedIn:</h5>
        <a href="https://www.linkedin.com/in/jawanistanford/" target="_blank">
          https://www.linkedin.com/in/jawanistanford/
        </a>
      </div>
      <div class="mt-2 d-flex justify-content-center align-items-center gap-2">
  <h5 class="mb-0">GitHub:</h5>
  <a href="https://github.com/JKodes" target="_blank">
    https://github.com/JKodes
  </a>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      const darkModeToggle = document.getElementById("darkModeToggle");
      const themeIcon = document.getElementById("themeIcon");
      const html = document.documentElement;

      if (localStorage.getItem("theme") === "dark") {
        html.setAttribute("data-bs-theme", "dark");
        darkModeToggle.checked = true;
        themeIcon.classList.remove("bi-brightness-high");
        themeIcon.classList.add("bi-moon-fill");
      }

      darkModeToggle.addEventListener("change", function () {
        if (darkModeToggle.checked) {
          html.setAttribute("data-bs-theme", "dark");
          localStorage.setItem("theme", "dark");
          themeIcon.classList.remove("bi-brightness-high");
          themeIcon.classList.add("bi-moon-fill");
        } else {
          html.setAttribute("data-bs-theme", "light");
          localStorage.setItem("theme", "light");
          themeIcon.classList.remove("bi-moon-fill");
          themeIcon.classList.add("bi-brightness-high");
        }
      });
    </script>
  </body>
</html>
