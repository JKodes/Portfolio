<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jay's Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="app.css" />
    <style>
      .navbar-brand,
      .navbar-nav,
      .navbar-links {
        font-family: "Press Start 2P", cursive;
        font-size: 0.8rem;
      }
      .navbar-nav,
      .nav-item {
        margin: 0 10px;
      }

      .navbar {
        padding-top: 1rem;
        padding-bottom: 1rem;
      }

      body {
        font-family: "Roboto", sans-serif;
        background-color: #423e37;
        color: #edebd7;
      }

      .hero-section {
        height: 45vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .hero-heading {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        line-height: 1.5;
        font-family: "Press Start 2P", cursive;
      }

      .form-check-input:checked {
        background-color: #212529;
        border-color: #212529;
      }

      .form-switch .form-check-input {
        height: 1.5rem;
        width: 3rem;
        cursor: pointer;
      }

      .form-switch .form-check-input:focus {
        border-color: rgba(0, 0, 0.6, 0.25);
        box-shadow: none;
      }

      .theme-icon {
        cursor: pointer;
        font-size: 1.2rem;
        vertical-align: middle;
      }
      html[data-bs-theme="dark"] {
        --bs-body-bg: #212529;
        --bs-body-color: #f8f9fa;
      }

      .scroller-container {
        position: relative;
        overflow: hidden;
        width: 100vw;
        background-color: white;
        padding: 20px 0;
        white-space: nowrap;
        border-top: whitesmoke 2px solid;
        border-bottom: whitesmoke 2px solid;
      }

      .scroller-wrapper {
        display: flex;
        width: 200%;
      }

      .scroller {
        display: flex;
        gap: 30px;
        padding: 10px 0;
        animation: scroll 30s linear infinite;
        width: max-content;
      }

      @keyframes scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      .language-icon {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        min-width: 120px;
        user-select: none;
        flex-shrink: 0;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin-bottom: 10px;
        transition: transform 0.2s;
      }

      .language-icon:hover .icon {
        transform: scale(1.1);
      }

      .language-name {
        font-weight: bold;
        color: #333;
      }

      /* Dark mode support for scroller */
      html[data-bs-theme="dark"] .scroller-container {
        background-color: #343a40;
      }

      html[data-bs-theme="dark"] .language-name {
        color: #f8f9fa;
      }

      html[data-bs-theme="dark"] .icon {
        filter: invert(0.8) !important;
      }
    </style>
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">JS</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="project.html">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contacts.html">Contact</a>
            </li>
          </ul>
        </div>
        <div class="form-check form-switch ms-auto d-none d-lg-block">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="darkModeToggle"
          />
          <label class="form-check-label" for="darkModeToggle">
            <i class="bi bi-brightness-high theme-icon" id="themeIcon"></i>
          </label>
        </div>
      </div>
    </nav>

    <section class="hero-section">
      <div class="container">
        <h1 class="hero-heading">Jawani Stanford</h1>
        <p class="lead">Software Engineer | New York</p>
      </div>
    </section>

    <!-- Scroller container now spans full width of page -->

    <div class="scroller-container">
      <div class="scroller-wrapper">
        <div class="scroller" id="languageScroller">
          <!-- Icons will be added dynamically via JavaScript -->
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      const darkModeToggle = document.getElementById("darkModeToggle");
      const themeIcon = document.getElementById("themeIcon");
      const html = document.documentElement;

      if (localStorage.getItem("theme") === "dark") {
        html.setAttribute("data-bs-theme", "dark");
        darkModeToggle.checked = true;
        themeIcon.classList.remove("bi-brightness-high");
        themeIcon.classList.add("bi-moon-fill");
      }

      darkModeToggle.addEventListener("change", function () {
        if (darkModeToggle.checked) {
          html.setAttribute("data-bs-theme", "dark");
          localStorage.setItem("theme", "dark");
          themeIcon.classList.remove("bi-brightness-high");
          themeIcon.classList.add("bi-moon-fill");
        } else {
          html.setAttribute("data-bs-theme", "light");
          localStorage.setItem("theme", "light");
          themeIcon.classList.remove("bi-moon-fill");
          themeIcon.classList.add("bi-brightness-high");
        }
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const scroller = document.getElementById("languageScroller");

        // Language data with icon URLs from simpleicons.org
        const languages = [
          {
            name: "HTML5",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/html5.svg",
          },
          {
            name: "CSS",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/css3.svg",
          },
          {
            name: "JavaScript",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/javascript.svg",
          },
          {
            name: "React",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/react.svg",
          },
          {
            name: "Bootstrap",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/bootstrap.svg",
          },

          {
            name: "Python",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/python.svg",
          },
          {
            name: "Git",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/git.svg",
          },
          {
            name: "GitHub",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/github.svg",
          },
          {
            name: "MongoDB",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/mongodb.svg",
          },
          {
            name: "Express",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/express.svg",
          },
          {
            name: "PostgreSQL",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/postgresql.svg",
          },

          {
            name: "Bash",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/gnubash.svg",
          },
          {
            name: "Redis",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/redis.svg",
          },
          {
            name: "NPM",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/npm.svg",
          },
          {
            name: "TypeScript",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/typescript.svg",
          },
          {
            name: "Django",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/django.svg",
          },

          {
            name: "Docker",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/docker.svg",
          },
          {
            name: "Postman",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/postman.svg",
          },
          {
            name: "Next.js",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/nextdotjs.svg",
          },

          {
            name: "Figma",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/figma.svg",
          },
          {
            name: "GraphQL",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/graphql.svg",
          },
          {
            name: "Remix.js",
            icon: "https://cdn.jsdelivr.net/npm/simple-icons@v8/icons/remix.svg",
          },
        ];

        // Dynamically add icons to the scroller
        function createLanguageIcons() {
          scroller.innerHTML = ""; // Clear existing content

          // Duplicate list for seamless scrolling
          const doubledLanguages = [...languages, ...languages];

          doubledLanguages.forEach((language) => {
            const languageElement = document.createElement("div");
            languageElement.classList.add("language-icon");

            languageElement.innerHTML = `
        <img src="${language.icon}" alt="${language.name}" class="icon" />
        <p class="language-name">${language.name}</p>
      `;

            scroller.appendChild(languageElement);
          });
        }

        createLanguageIcons();
      });
    </script>
  </body>
</html>
